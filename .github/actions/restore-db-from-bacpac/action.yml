name: Restore Azure SQL DB from BACPAC
description: Restore Azure SQL DB from BACPAC

inputs:
  backup_env:
    description: The github env to take the backup from
    required: true
    default: 'ProductionUnprotected'
  db_env:
    description: The github env to restore the db to
    required: true
    default: 'Dev'
  resource_group_backup:
    description: Backup resource group
    required: true
  resource_group_db:
    description: Db resource group
    required: true
  ip-address:
    description: The IP address to whitelist or remove
    required: true
  sql_server_name:
    description: SQL server name
    required: true
  target_database:
    description: Target database
    required: true
  storage_account:
    description: Storage account name
    required: true
  container_name:
    description: Container name
    required: true
  bacpac_file:
    description: Specific BACPAC file
    required: false
    default: ""
  bacpac_prefix:
    description: BACPAC filename prefix
    required: false
    default: ""
  use_latest_if_not_specified:
    description: Use latest BACPAC if no file is specified
    required: false
    default: "true"
  delete_if_exists:
    description: Can only restore into an empty or non-existant db. Delete if found?
    required: false
    default: "false"
  dev_client_id:
    description: az client id dev
    required: true
  dev_tenant_id: 
    description: az tenant id dev
    required: true
  dev_subscription_id:
    description: az sub id dev
    required: true
  prod_client_id:
    description: az client id prod
    required: true
  prod_tenant_id:
    description: az tenant id prod
    required: true
  prod_subscription_id:
    description: az sub id prod
    required: true
runs:
  using: composite
  steps:

    - name: Determine Azure environments
      id: azure-envs
      shell: bash
      env:
        BACKUP_ENV: ${{ inputs.backup_env }}
        DB_ENV: ${{ inputs.db_env }}
      run: |
        set -euo pipefail

        normalise_env() {
          echo "${1%Unprotected}"
        }

        BACKUP_BASE="$(normalise_env "$BACKUP_ENV")"
        DB_BASE="$(normalise_env "$DB_ENV")"

        echo "backup_base=$BACKUP_BASE" >> "$GITHUB_OUTPUT"
        echo "db_base=$DB_BASE" >> "$GITHUB_OUTPUT"

        echo "Backup Azure environment: $BACKUP_BASE"
        echo "Database Azure environment: $DB_BASE"

    - name: Login for backup access
      uses: azure/login@v3
      with:
        client-id: ${{ steps.azure-envs.outputs.backup_base == 'Production' && inputs.prod_client_id || inputs.dev_client_id }}
        tenant-id: ${{ steps.azure-envs.outputs.backup_base == 'Production' && inputs.prod_tenant_id || inputs.dev_tenant_id }}
        subscription-id: ${{ steps.azure-envs.outputs.backup_base == 'Production' && inputs.prod_subscription_id || inputs.dev_subscription_id }}

    - name: Whitelist Runner for backup storage
      uses: ./.github/actions/whitelist-storage
      with:
        ip-address: ${{ inputs.ip-address }}
        resource-group: ${{ inputs.resource_group_backup }}
        account-name: ${{ inputs.storage_account }}
        verb: add

    - name: Resolve BACPAC blob name
      id: resolve-bacpac
      shell: bash
      run: |
        set -euo pipefail

        INPUT_BACPAC_FILE="${{ inputs.bacpac_file }}"
        PREFIX="${{ inputs.bacpac_prefix }}"
        USE_LATEST="${{ inputs.use_latest_if_not_specified }}"
        ACCOUNT="${{ inputs.storage_account }}"
        CONTAINER="${{ inputs.container_name }}"

        if [ -n "$INPUT_BACPAC_FILE" ]; then
          BACPAC_FILE="$INPUT_BACPAC_FILE"
          echo "Using explicit BACPAC file: $BACPAC_FILE"
        else
          if [ "$USE_LATEST" != "true" ]; then
            echo "No bacpac_file provided and use_latest_if_not_specified is false."
            exit 1
          fi

          echo "Finding latest .bacpac blob in container $CONTAINER..."

          if [ -n "$PREFIX" ]; then
            QUERY="[?properties.blobType=='BlockBlob' && ends_with(name, '.bacpac') && starts_with(name, '$PREFIX')] | sort_by(@, &properties.lastModified) | [-1].name"
          else
            QUERY="[?properties.blobType=='BlockBlob' && ends_with(name, '.bacpac')] | sort_by(@, &properties.lastModified) | [-1].name"
          fi

          BACPAC_FILE=$(az storage blob list \
            --account-name "$ACCOUNT" \
            --container-name "$CONTAINER" \
            --auth-mode login \
            --query "$QUERY" \
            -o tsv)

          if [ -z "$BACPAC_FILE" ]; then
            echo "No matching .bacpac blob found."
            exit 1
          fi

          echo "Resolved latest BACPAC file: $BACPAC_FILE"
        fi

        echo "bacpac_file=$BACPAC_FILE" >> "$GITHUB_OUTPUT"
        echo "bacpac_uri=https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}/${BACPAC_FILE}" >> "$GITHUB_OUTPUT"

    - name: Download resolved BACPAC
      id: download
      shell: bash
      run: |
        set -euo pipefail

        ACCOUNT="${{ inputs.storage_account }}"
        CONTAINER="${{ inputs.container_name }}"
        BLOB_NAME="${{ steps.resolve-bacpac.outputs.bacpac_file }}"

        echo "Downloading resolved bacpac: $BLOB_NAME"

        az storage blob download \
          --account-name "$ACCOUNT" \
          --container-name "$CONTAINER" \
          --name "$BLOB_NAME" \
          --file "$BLOB_NAME" \
          --auth-mode login

        echo "bacpac_file=$BLOB_NAME" >> "$GITHUB_OUTPUT"

    - name: Undo Whitelist Runner for backup storage
      uses: ./.github/actions/whitelist-storage
      with:
        ip-address: ${{ inputs.ip-address }}
        resource-group: ${{ inputs.resource_group_backup }}
        account-name: ${{ inputs.storage_account }}
        verb: remove

    - name: Login for database restore
      if: ${{ steps.azure-envs.outputs.backup_base != steps.azure-envs.outputs.db_base }}
      uses: azure/login@v3
      with:
        client-id: ${{ steps.azure-envs.outputs.db_base == 'Production' && inputs.prod_client_id || inputs.dev_client_id }}
        tenant-id: ${{ steps.azure-envs.outputs.db_base == 'Production' && inputs.prod_tenant_id || inputs.dev_tenant_id }}
        subscription-id: ${{ steps.azure-envs.outputs.db_base == 'Production' && inputs.prod_subscription_id || inputs.dev_subscription_id }}

    - name: Install SqlPackage
      shell: bash
      run: dotnet tool install --global Microsoft.SqlPackage

    - name: Whitelist Runner for sql
      uses: ./.github/actions/whitelist-sql
      with:
        ip-address: ${{ inputs.ip-address }}
        resource-group: ${{ inputs.resource_group_db }}
        server-name: ${{ inputs.sql_server_name }}
        verb: add

    - name: Delete existing db to allow importing into empty
      id: delete
      if: ${{ inputs.delete_if_exists == 'true' }}
      shell: bash
      run: |
          set -euo pipefail
          echo "Target database: ${{ inputs.target_database }}"

          if az sql db show \
            --resource-group "${{ inputs.resource_group_db }}" \
            --server "${{ inputs.sql_server_name }}" \
            --name "${{ inputs.target_database }}" \
            >/dev/null 2>&1; then

          echo "Deleting existing spare database..."

          az sql db delete \
            --resource-group "${{ inputs.resource_group_db }}" \
            --server "${{ inputs.sql_server_name }}" \
            --name "${{ inputs.target_database }}" \
            --yes

          echo "Waiting for deletion to complete..."

          until ! az sql db show \
            --resource-group "${{ inputs.resource_group_db }}" \
            --server "${{ inputs.sql_server_name }}" \
            --name "${{ inputs.target_database }}" \
            >/dev/null 2>&1; do
            sleep 10
          done
          else
            echo "Target database does not currently exist."
          fi

    - name: Check whether database exists
      id: db-check
      shell: bash
      run: |
        if az sql db show \
          --resource-group "${{ inputs.resource_group_app }}" \
          --server "${{ inputs.sql_server_name }}" \
          --name "${{ inputs.target_database }}" \
          >/dev/null 2>&1; then

          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Recreate database
      if: ${{ inputs.delete_if_exists == 'true' || steps.db-check.outputs.exists == 'false' }}
      shell: bash
      run: |
        if [[ "${{ steps.azure-envs.outputs.db_base }}" == "Production" ]]; then
          SKU="S2"
        else
          SKU="Basic"
        fi

        echo "Creating ${{ inputs.target_database }} with SKU ${SKU}"

        az sql db create \
          --resource-group "${{ inputs.resource_group_db }}" \
          --server "${{ inputs.sql_server_name }}" \
          --name "${{ inputs.target_database }}" \
          --service-objective "${SKU}"

    - name: Import BACPAC with SqlPackage
      shell: bash
      run: |
        set -euo pipefail
        echo "Waiting for SQL firewall rule to propagate..."
        sleep 120
        ACCESS_TOKEN="$(az account get-access-token \
          --resource https://database.windows.net/ \
          --query accessToken \
          -o tsv)"

        sqlpackage \
          /Action:Import \
          /SourceFile:"${{ steps.download.outputs.bacpac_file }}" \
          /TargetServerName:"${{ inputs.sql_server_name }}.database.windows.net" \
          /TargetDatabaseName:"${{ inputs.target_database }}" \
          /AccessToken:"$ACCESS_TOKEN"

    - name: Grant Container App identity access to restored SQL DB
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Install-Module SqlServer -Force -Scope CurrentUser -AllowClobber

        $rg = "${{ inputs.resource_group_db }}"
        $sqlServer = "${{ inputs.sql_server_name }}"
        $sqlDb = "${{ inputs.target_database }}"
        $containerApp = "${{ inputs.resource_group_db }}-plan-tech-app"

        $sqlFqdn = az sql server show `
          --resource-group $rg `
          --name $sqlServer `
          --query fullyQualifiedDomainName `
          -o tsv

        $identityResourceId = az containerapp identity show `
          --resource-group $rg `
          --name $containerApp `
          --query "userAssignedIdentities | keys(@)[0]" `
          -o tsv

        if ([string]::IsNullOrWhiteSpace($identityResourceId)) {
          throw "No user-assigned identity found on container app $rg"
        }

        $identityName = Split-Path $identityResourceId -Leaf

        $identityClientId = az identity show `
          --ids $identityResourceId `
          --query clientId `
          -o tsv

        if ([string]::IsNullOrWhiteSpace($identityClientId)) {
          throw "Could not resolve client/appId for identity $identityClientId"
        }

        $sidHex = python3 -c "import uuid; print('0x' + uuid.UUID('$identityClientId').bytes_le.hex())"

        $token = az account get-access-token `
          --resource https://database.windows.net/ `
          --query accessToken `
          -o tsv

        $query = @"
        IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$identityName')
        BEGIN
          CREATE USER [$identityName] WITH SID = $sidHex, TYPE = E;
        END;

        ALTER ROLE db_datareader ADD MEMBER [$identityName];
        ALTER ROLE db_datawriter ADD MEMBER [$identityName];
        ALTER ROLE db_ddladmin ADD MEMBER [$identityName];
        ALTER ROLE db_executor ADD MEMBER [$identityName];
        GRANT EXECUTE TO [$identityName];
        GRANT INSERT TO [$identityName];
        GRANT SELECT TO [$identityName];

        DELETE FROM dbo.DataProtectionKeys;

        "@

        Invoke-Sqlcmd `
          -ServerInstance $sqlFqdn `
          -Database $sqlDb `
          -AccessToken $token `
          -Query $query

    - name: Undo Whitelist Runner for sql
      uses: ./.github/actions/whitelist-sql
      with:
        ip-address: ${{ inputs.ip-address }}
        resource-group: ${{ inputs.resource_group_db }}
        server-name: ${{ inputs.sql_server_name }}
        verb: remove
