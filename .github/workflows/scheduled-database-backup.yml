name: Scheduled Database Backup

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to back up
        required: true
        type: choice
        options: ['Dev', 'Tst', 'StagingUnprotected', 'ProductionUnprotected']
        default: 'ProductionUnprotected'

jobs:
  backup_database:
    name: Back up database
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: ${{ inputs.environment }}
    uses: ./.github/workflows/back-up-database.yml
    with:
      environment: ${{ inputs.environment || 'ProductionUnprotected' }}
