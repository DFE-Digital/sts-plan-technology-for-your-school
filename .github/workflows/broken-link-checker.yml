name: Contentful Broken Link Checker

on:
  schedule:
    - cron: 0 1 * * 1-5
  workflow_dispatch:
    inputs:
      environment:
        description: Which Contentful environment to check for broken links
        required: true
        type: choice
        options: ['Dev', 'Tst', 'StagingUnprotected', 'ProductionUnprotected']
        default: 'StagingUnprotected'

jobs:
  check_broken_links:
    name: Contentful broken link checker
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'StagingUnprotected' }}
    env:
      az_keyvault_name: ${{ secrets.AZ_ENVIRONMENT }}${{ vars.DFE_PROJECT_NAME }}-kv
      az_resource_group_name: ${{ secrets.AZ_ENVIRONMENT }}${{ vars.DFE_PROJECT_NAME }}
      az_keyvault_contentful_environment: contentful--environment
      az_keyvault_contentful_space_id: contentful--spaceid
      az_keyvault_contentful_management_token: contentful--managementtoken
      USE_PREVIEW: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Login with AZ
        uses: ./.github/actions/azure-login
        with:
          az_tenant_id: ${{ secrets.AZ_TENANT_ID }}
          az_subscription_id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          az_client_id: ${{ secrets.AZ_CLIENT_ID }}

      - name: Get workflow IP address
        id: whats-my-ip
        uses: ./.github/actions/whats-my-ip-address

      - name: Whitelist IP on Key Vault
        uses: ./.github/actions/whitelist-kv
        with:
          ip-address: ${{ steps.whats-my-ip.outputs.ip }}
          resource-group: ${{ env.az_resource_group_name }}
          keyvault-name: ${{ env.az_keyvault_name }}
          verb: add

      - name: Get secrets
        id: get-broken-link-checker-secrets
        shell: bash
        run: |
          environment=$(az keyvault secret show --name ${{ env.az_keyvault_contentful_environment }} --vault-name ${{ env.az_keyvault_name }} --query value -o tsv)
          space_id=$(az keyvault secret show --name ${{ env.az_keyvault_contentful_space_id }} --vault-name ${{ env.az_keyvault_name }} --query value -o tsv)
          management_token=$(az keyvault secret show --name ${{ env.az_keyvault_contentful_management_token }} --vault-name ${{ env.az_keyvault_name }} --query value -o tsv)
          echo "::add-mask::$environment"
          echo "::add-mask::$space_id"
          echo "::add-mask::$management_token"
          echo "ENVIRONMENT=$environment" >> $GITHUB_ENV
          echo "SPACE_ID=$space_id" >> $GITHUB_ENV
          echo "MANAGEMENT_TOKEN=$management_token" >> $GITHUB_ENV

      - name: Install export-processor deps
        working-directory: ./contentful/export-processor/
        run: npm ci

      - name: Install broken-link-checker dependencies
        working-directory: ./contentful/broken-link-checker/
        run: npm ci

      - name: Run get-links.js && checker.js
        working-directory: ./contentful/broken-link-checker/
        run: npm run checker

      - name: Upload report files
        uses: actions/upload-artifact@v4
        with:
          name: report-files-${{ inputs.environment }}
          path: ./contentful/broken-link-checker/report/
          if-no-files-found: warn

      - name: Remove IP from Key Vault
        if: always()
        uses: ./.github/actions/whitelist-kv
        with:
          ip-address: ${{ steps.whats-my-ip.outputs.ip }}
          resource-group: ${{ env.az_resource_group_name }}
          keyvault-name: ${{ env.az_keyvault_name }}
          verb: remove

